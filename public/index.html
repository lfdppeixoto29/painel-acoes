<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Inteligente de Ações - Top 3 Melhores Compras</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --accent-green: #22c55e;
      --accent-blue: #38bdf8;
      --border-color: #334155;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 15px;
      margin-bottom: 25px;
    }
    h1 { margin: 0; font-size: 24px; color: var(--accent-blue); }
    .btn {
      background: var(--accent-blue);
      color: #000;
      border: none;
      padding: 10px 20px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn:hover { opacity: 0.9; }
    
    .top3-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 30px;
    }
    @media(max-width: 1024px) { .top3-container { grid-template-columns: 1fr; } }

    .card-top3 {
      background: linear-gradient(135deg, #1e293b 0%, #065f46 100%);
      border: 2px solid var(--accent-green);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 10px 25px -5px rgba(34, 197, 94, 0.2);
    }
    .badge {
      background: var(--accent-green);
      color: #000;
      padding: 3px 8px;
      font-size: 11px;
      font-weight: bold;
      border-radius: 20px;
      text-transform: uppercase;
    }
    
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 20px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid var(--border-color);
      font-size: 14px;
    }
    th { color: #94a3b8; }
    tr:hover { background: rgba(255,255,255,0.02); }
    .lucro { color: var(--accent-green); font-weight: bold; }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>📈 Painel de Ações & Top 3 Melhores Compras</h1>
      <small id="atualizacao" style="color: #94a3b8;">Carregando última atualização...</small>
    </div>
    <button class="btn" onclick="atualizarAgente()">🔄 Rodar Agente & Atualizar</button>
  </header>

  <!-- TOP 3 AÇÕES RECOMENDADAS COM GRÁFICOS -->
  <h2 style="font-size: 18px; color: var(--accent-green); margin-bottom: 15px;">🔥 As 3 Melhores Oportunidades de Compra Agora</h2>
  <div class="top3-container" id="top3-grid">
    <!-- Será preenchido via JavaScript -->
  </div>

  <!-- TABELA DE OPORTUNIDADES -->
  <div class="card">
    <h3>🔍 Radar Completo de Ações de Baixo Valor & Tendência</h3>
    <div style="overflow-x: auto;">
      <table>
        <thead>
          <tr>
            <th>Rank</th>
            <th>Ticker</th>
            <th>Empresa</th>
            <th>Preço Atual</th>
            <th>RSI</th>
            <th>Tendência</th>
            <th>Lucro Est.</th>
          </tr>
        </thead>
        <tbody id="tabela-acoes">
          <tr><td colspan="7" style="text-align: center;">Carregando dados...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    let graficosTop3 = [];

    async function carregarDados() {
      try {
        const res = await fetch('/api/dados');
        const dados = await res.json();

        document.getElementById('atualizacao').innerText = 'Última atualização do agente (de hora em hora): ' + new Date(dados.ultimaAtualizacao).toLocaleString();

        const top3 = dados.listaCompleta.slice(0, 3);
        const container = document.getElementById('top3-grid');
        container.innerHTML = '';

        // Destruir gráficos anteriores para evitar vazamento de memória
        graficosTop3.forEach(g => g.destroy());
        graficosTop3 = [];

        top3.forEach((acao, index) => {
          const cardId = 'card-grafico-' + index;
          const cardHtml = `
            <div class="card-top3">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <span class="badge">#${index + 1} Recomendação</span>
                <span style="font-size: 16px; font-weight: bold;">${acao.ticker}</span>
              </div>
              <h3 style="margin: 0 0 5px 0; font-size: 20px;">${acao.nome}</h3>
              <p style="margin: 5px 0;">Preço: <strong>R$ ${acao.preco.toFixed(2)}</strong></p>
              <p style="margin: 5px 0;">Tendência: <span style="color: var(--accent-green); font-weight: bold;">${acao.tendencia}</span></p>
              <p style="margin: 5px 0 15px 0;">Lucro Est.: <span class="lucro">+${acao.lucroEstimado}%</span></p>
              <canvas id="${cardId}" height="110"></canvas>
            </div>
          `;
          container.innerHTML += cardHtml;
        });

        // Renderizar os 3 gráficos após inserir no DOM
        top3.forEach((acao, index) => {
          const cardId = 'card-grafico-' + index;
          const ctx = document.getElementById(cardId).getContext('2d');
          const chart = new Chart(ctx, {
            type: 'line',
            data: {
              labels: ['H-6', 'H-5', 'H-4', 'H-3', 'H-2', 'H-1', 'Atual'],
              datasets: [{
                label: acao.ticker,
                data: acao.historico,
                borderColor: '#22c55e',
                backgroundColor: 'rgba(34, 197, 94, 0.1)',
                borderWidth: 2,
                fill: true,
                tension: 0.3
              }]
            },
            options: {
              responsive: true,
              plugins: { legend: { display: false } },
              scales: {
                y: { grid: { color: '#334155' }, ticks: { color: '#94a3b8', font: { size: 10 } } },
                x: { grid: { display: false }, ticks: { color: '#94a3b8', font: { size: 10 } } }
              }
            }
          });
          graficosTop3.push(chart);
        });

        // Preencher Tabela Completa
        const tbody = document.getElementById('tabela-acoes');
        tbody.innerHTML = '';
        dados.listaCompleta.forEach((acao, idx) => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>#${idx + 1}</td>
            <td><strong>${acao.ticker}</strong></td>
            <td>${acao.nome}</td>
            <td>R$ ${acao.preco.toFixed(2)}</td>
            <td>${acao.rsi}</td>
            <td style="color: var(--accent-green);">${acao.tendencia}</td>
            <td class="lucro">+${acao.lucroEstimado}%</td>
          `;
          tbody.appendChild(tr);
        });

      } catch (e) {
        console.error('Erro ao carregar dados:', e);
      }
    }

    async function atualizarAgente() {
      const btn = document.querySelector('.btn');
      btn.innerText = '🔄 Rodando Agente...';
      await fetch('/api/atualizar', { method: 'POST' });
      await carregarDados();
      btn.innerText = '🔄 Rodar Agente & Atualizar';
    }

    carregarDados();
  </script>
</body>
</html>
